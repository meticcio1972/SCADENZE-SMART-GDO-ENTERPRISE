<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offerte</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="database.js"></script>
<script src="offerte.js" defer></script>
</head>

<body>

<div class="container">

<h1>📢 Gestione Offerte</h1>

<div class="toolbar">

<input
id="ricercaOfferta"
type="text"
placeholder="Cerca prodotto...">

<button id="nuovaOfferta">
➕ Nuova Offerta
</button>

<button id="stampaOfferte">
🖨️ Stampa
</button>

<button id="excelOfferte">
📊 Excel
</button>

</div>

<table>

<thead>

<tr>

<th>Codice</th>
<th>Descrizione</th>
<th>Reparto</th>
<th>Prezzo</th>
<th>Prezzo Offerta</th>
<th>Azioni</th>

</tr>

</thead>

<tbody id="tabellaOfferte">

</tbody>

</table>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="database.js"></script>
<script src="offerte.js"></script>
</body>

</html>
